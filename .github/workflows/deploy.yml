name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build web
        run: npx expo export --platform web
        env:
          # Baked into the bundle so the running app knows which build it is.
          # Compared at runtime against the freshly-fetched dist/version.json.
          # The /GymMate/ base path is applied natively via app.json
          # experiments.baseUrl — no post-build path rewriting needed.
          EXPO_PUBLIC_APP_VERSION: ${{ github.sha }}

      - name: Finalize web build (manifest, font-face, 404, version)
        run: node scripts/postbuild-web.js
        env:
          EXPO_PUBLIC_APP_VERSION: ${{ github.sha }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
